name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML
      - run: python tests/validate.py
      - run: sh -n plugins/rehydrate/scripts/rehydrate-on-compact.sh
      - name: Smoke test POSIX hook
        run: |
          output=$(printf '%s' '{"source":"compact","session_id":"test"}' | plugins/rehydrate/scripts/rehydrate-on-compact.sh)
          printf '%s\n' "$output" | grep -F '<rehydrate-trigger>'
          printf '%s\n' "$output" | grep -F '$rehydrate'
          printf '%s\n' "$output" | grep -F 'entire session'
          printf '%s\n' "$output" | grep -F 'observable assistant actions'
          printf '%s\n' "$output" | grep -F 'never inspect hidden reasoning'
          printf '%s\n' "$output" | grep -F 'do not wait for another user message'
          printf '%s\n' "$output" | grep -F '"session_id":"test"'

  windows-hook:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Smoke test PowerShell hook
        shell: pwsh
        run: |
          $payload = '{"source":"compact","session_id":"test"}'
          $output = $payload | pwsh -NoProfile -File ./plugins/rehydrate/scripts/rehydrate-on-compact.ps1
          $joined = $output -join "`n"
          if (-not $joined.Contains('<rehydrate-trigger>')) {
            throw 'Missing rehydrate trigger marker'
          }
          if (-not $joined.Contains('$rehydrate')) {
            throw 'Missing explicit skill invocation'
          }
          if (-not $joined.Contains('entire session')) {
            throw 'Missing session-wide recovery instruction'
          }
          if (-not $joined.Contains('observable assistant actions')) {
            throw 'Missing observable-action instruction'
          }
          if (-not $joined.Contains('never inspect hidden reasoning')) {
            throw 'Missing hidden-content boundary'
          }
          if (-not $joined.Contains('do not wait for another user message')) {
            throw 'Missing execution-time lookup instruction'
          }
          if (-not $joined.Contains('"session_id":"test"')) {
            throw 'Missing session payload'
          }
